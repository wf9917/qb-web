<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社工大赛题库练习 · 400题</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --ink:#1f2733; --muted:#6b7684;
    --line:#e3e8ef; --brand:#2563eb; --brand-soft:#e8f0fe;
    --ok:#16a34a; --ok-soft:#e7f7ee;
    --bad:#dc2626; --bad-soft:#fdeceb;
    --mid:#d97706; --mid-soft:#fef4e6;
    --skip:#64748b; --skip-soft:#eef1f5;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    font-size:15px;line-height:1.65;
  }
  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 120px}

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:50;background:rgba(244,246,249,.94);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -16px 20px;padding:12px 16px}
  .hrow{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .title{font-weight:700;font-size:16px;letter-spacing:.2px}
  .title span{color:var(--muted);font-weight:400;font-size:13px;margin-left:6px}
  .spacer{flex:1}
  .prog{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;font-weight:600}
  .barbg{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
  .barfill{height:100%;width:0;background:var(--brand);border-radius:99px;transition:width .25s}

  /* ---------- buttons ---------- */
  button{font-family:inherit;font-size:14px;cursor:pointer;border-radius:9px;
    border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:7px 14px;transition:.15s;line-height:1.4}
  button:hover:not(:disabled){border-color:#c6cfdb;background:#fafbfc}
  button:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .btn-primary:hover:not(:disabled){background:#1d4ed8;border-color:#1d4ed8}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 10px}
  .btn-ghost:hover{background:#eaeef4;color:var(--ink)}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .tab{padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:#fff;
    font-size:13px;cursor:pointer;color:var(--muted);transition:.15s;user-select:none;
    white-space:nowrap;flex:0 0 auto}
  .tab:hover{border-color:#c6cfdb;color:var(--ink)}
  .tab.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}

  /* ---------- card ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:22px 22px 18px;box-shadow:var(--shadow)}
  .qhead{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
  .badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:6px;letter-spacing:.3px}
  .badge.single{background:var(--brand-soft);color:var(--brand)}
  .badge.multi{background:#f3e8ff;color:#7e22ce}
  .qidx{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .topic{font-size:12px;color:var(--muted);background:#f1f4f8;padding:2px 9px;border-radius:6px}

  .stem{font-size:17px;line-height:1.7;font-weight:500;margin:0 0 18px}
  .opts{display:flex;flex-direction:column;gap:9px;margin-bottom:18px}
  .opt{display:flex;gap:11px;align-items:flex-start;padding:12px 15px;border:1.5px solid var(--line);
    border-radius:11px;cursor:pointer;transition:.13s;background:#fff}
  .opt:hover{border-color:#b9c4d4;background:#fcfdfe}
  .opt.sel{border-color:var(--brand);background:var(--brand-soft)}
  .opt.sel .k{background:var(--brand);color:#fff;border-color:var(--brand)}
  .opt.right{border-color:var(--ok);background:var(--ok-soft)}
  .opt.right .k{background:var(--ok);color:#fff;border-color:var(--ok)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
  .opt.locked{cursor:default}
  .opt.locked:hover{border-color:inherit;background:inherit}
  .opt.locked.right:hover{border-color:var(--ok);background:var(--ok-soft)}
  .opt.locked.wrong:hover{border-color:var(--bad);background:var(--bad-soft)}
  .k{flex:0 0 26px;height:26px;border-radius:7px;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;
    color:var(--muted);transition:.13s;background:#fff}
  .otext{flex:1;padding-top:1px}
  .mark{margin-left:6px;font-weight:700;font-size:13px}
  .mark.ok{color:var(--ok)} .mark.no{color:var(--bad)}

  /* ---------- action bar ---------- */
  .actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;
    padding-top:16px;border-top:1px solid var(--line)}
  .actions .grow{flex:1}

  /* ---------- verdict buttons ---------- */
  .verdicts{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
  .vb{flex:1 1 150px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    padding:11px 15px;border-radius:11px;border:1.5px solid var(--line);background:#fff;
    cursor:pointer;transition:.15s;text-align:left}
  .vb b{font-size:14px}
  .vb small{color:var(--muted);font-size:11.5px;font-weight:400}
  .vb:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .vb[data-v="know"]{border-color:#bbf7d0;background:var(--ok-soft)}
  .vb[data-v="know"]:hover{border-color:var(--ok)}
  .vb[data-v="dunno"]{border-color:#fecaca;background:var(--bad-soft)}
  .vb[data-v="dunno"]:hover{border-color:var(--bad)}
  .vb[data-v="unsure"]{border-color:#fde68a;background:var(--mid-soft)}
  .vb[data-v="unsure"]:hover{border-color:var(--mid)}

  .hint{font-size:13px;color:var(--muted);margin-bottom:12px;padding:9px 13px;
    background:#f7f9fc;border-radius:9px;border-left:3px solid var(--brand)}
  .hint.warn{background:var(--mid-soft);border-left-color:var(--mid)}

  /* ---------- feedback ---------- */
  .fb{margin-top:16px;padding:13px 16px;border-radius:10px;font-size:14px;font-weight:600;
    display:none}
  .fb.show{display:block}
  .fb.ok{background:var(--ok-soft);color:#15803d}
  .fb.bad{background:var(--bad-soft);color:#b91c1c}
  .fb.unsure{background:var(--mid-soft);color:#b45309}

  /* ---------- summary ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:18px 0 26px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow)}
  .stat .num{font-size:29px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
  .stat .lbl{font-size:12.5px;color:var(--muted);margin-top:3px}
  .stat.ko .num{color:var(--ok)} .stat.ba .num{color:var(--bad)} .stat.un .num{color:var(--mid)}

  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;
    overflow:hidden;box-shadow:var(--shadow);font-size:14px;margin-bottom:22px}
  th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:#f7f9fc;font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.2px}
  tr:last-child td{border-bottom:none}
  td.c{text-align:center;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;min-width:34px;text-align:center;padding:1px 8px;border-radius:99px;
    font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.ba{background:var(--bad-soft);color:var(--bad)}
  .pill.un{background:var(--mid-soft);color:var(--mid)}
  .pill.ze{background:#f1f4f8;color:#94a3b8}
  .rate{font-weight:700;font-variant-numeric:tabular-nums}

  h2{font-size:18px;margin:30px 0 13px;letter-spacing:.2px}
  h2:first-child{margin-top:0}
  .sub{color:var(--muted);font-size:13.5px;margin:-7px 0 15px}

  .misslist{background:#fff;border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);overflow:hidden}
  .miss{display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
  .miss:last-child{border-bottom:none}
  .miss:hover{background:#fafbfc}
  .miss .no{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;flex:0 0 34px;padding-top:2px}
  .miss .q{flex:1;font-size:14px}
  .miss .tag{font-size:11.5px;padding:1px 7px;border-radius:5px;font-weight:600;flex:0 0 auto}
  .tag.u{background:var(--mid-soft);color:var(--mid)}
  .tag.b{background:var(--bad-soft);color:var(--bad)}
  .ans{color:var(--ok);font-weight:700;margin-left:5px;font-size:13px}

  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty .big{font-size:44px;margin-bottom:12px;opacity:.5}

  .navrow{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
  .kbd{font-size:11.5px;color:var(--muted);background:#f1f4f8;padding:2px 7px;border-radius:5px;
    font-family:ui-monospace,Consolas,monospace}

  /* ---------- 模式切换按钮 ---------- */
  .mode-btn{
    flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:13px 6px;border-radius:13px;border:2px solid var(--line);background:#fff;
    cursor:pointer;transition:.15s;line-height:1.35;overflow:hidden;
  }
  .mode-btn b{font-size:15.5px;color:var(--muted);font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .mode-btn small{font-size:12px;color:#9aa5b4;font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .mode-btn:hover{border-color:#b9c4d4}
  .mode-btn.on{background:var(--brand);border-color:var(--brand);box-shadow:0 4px 14px rgba(37,99,235,.25)}
  .mode-btn.on b{color:#fff}
  .mode-btn.on small{color:rgba(255,255,255,.8)}
  #modeFill.on{background:#7c3aed;border-color:#7c3aed;box-shadow:0 4px 14px rgba(124,58,237,.25)}
  #modeFill.on b{color:#fff}
  #modeFill.on small{color:rgba(255,255,255,.8)}

  /* ---------- 复习闪卡 ---------- */
  #modeReview.on{background:#0891b2 !important;border-color:#0891b2 !important;box-shadow:0 4px 14px rgba(8,145,178,.25)}
  #modeReview.on b{color:#fff !important}
  #modeReview.on small{color:rgba(255,255,255,.85) !important}
  #flashCard:hover{transform:translateY(-1px)}
  #flashCard:active{transform:scale(.995)}
  #flashAnswer .fa-main{
    font-size:20px;font-weight:700;color:#15803d;line-height:1.55;
    background:var(--ok-soft);padding:16px 18px;border-radius:12px;
    word-break:break-word;
  }
  #flashAnswer .fa-label{font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600}

  /* ---------- 填空模式 ---------- */
  .fill-input{
    width:100%;padding:13px 15px;font-size:16px;font-family:inherit;color:var(--ink);
    border:1.5px solid var(--line);border-radius:11px;background:#fff;
    transition:.15s;outline:none;line-height:1.5;
  }
  .fill-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .fill-input.right{border-color:var(--ok);background:var(--ok-soft)}
  .fill-input.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .fill-input:disabled{opacity:.9;cursor:default}
  .fill-label{font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .fill-answer{
    margin-top:9px;padding:11px 15px;border-radius:10px;font-size:14.5px;
    background:var(--ok-soft);color:#15803d;font-weight:600;line-height:1.65;
  }
  .fill-answer .u{font-weight:400;color:#4b7a5c;font-size:13px}
  .stem .blank{
    display:inline-block;min-width:74px;border-bottom:2px solid var(--brand);
    margin:0 4px;color:var(--brand);font-weight:700;text-align:center;
  }

  @media(max-width:640px){
    body{font-size:15px;-webkit-text-size-adjust:100%;overflow-x:hidden}
    .wrap{padding:14px 12px 130px;max-width:100%;overflow-x:hidden}
    /* 手机上紧凑头部：一行放得下 */
    .hrow{gap:6px}
    .title{font-size:14px;white-space:nowrap}
    .title span{display:none}
    .hrow .prog{font-size:11.5px !important;white-space:nowrap}
    .hrow .btn-ghost{padding:6px 7px !important;font-size:12px !important}
    #saveStatus{display:none}
    header{padding:9px 10px;margin:0 -12px 12px}
    /* 防止长内容撑破 */
    .stem,.qhead,.hint,.opt,.card{max-width:100%;overflow-wrap:anywhere;word-break:break-word}
    .mode-btn{padding:11px 4px}
    .mode-btn b{font-size:13px;letter-spacing:-.2px}
    .mode-btn small{font-size:11px}
    #modeSwitch{gap:7px}
    .card{padding:17px 15px 15px}
    .stem{font-size:16.5px;line-height:1.75}
    .vb{flex:1 1 100%}
    th,td{padding:9px 8px;font-size:13px}
    /* 手机上加大可点区域，防误触 */
    .opt{padding:15px 14px;border-radius:12px;margin-bottom:2px}
    .opt .k{flex:0 0 30px;height:30px;font-size:14px}
    .opt .otext{font-size:15.5px;line-height:1.6}
    button{padding:11px 16px;font-size:15px}
    .btn-ghost{padding:9px 12px}
    .tab{padding:9px 15px;font-size:14px}
    /* 手机：标签栏改成单行横向滚动，不再换行占两行 */
    .tabs{
      flex-wrap:nowrap !important;
      overflow-x:auto;
      overflow-y:hidden;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      margin:0 -12px 12px -12px;
      padding:2px 12px 8px 12px;
    }
    .tabs::-webkit-scrollbar{display:none}
    .tab{flex:0 0 auto;white-space:nowrap}
    .actions{gap:10px}
    #btnSubmit,#btnUnsure{flex:1 1 auto;min-height:46px}
    .navrow .kbd{display:none}
    #fabSummary{padding:13px 22px !important;font-size:15px !important}
  }
  /* 触摸设备：去掉 hover 效果，避免点完还停在悬停态 */
  @media(hover:none){
    .opt:hover{border-color:var(--line);background:#fff}
    button:hover:not(:disabled){border-color:var(--line);background:#fff}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="hrow">
      <div class="title">社工大赛题库练习<span id="hdrSub">400 题</span></div>
      <div class="spacer"></div>
      <span class="prog" id="saveStatus" style="font-size:12px"></span>
      <div class="prog" id="hdrProg">0 / 400</div>
      <button class="btn-ghost" id="btnGhSync" title="设置 GitHub 同步">☁</button>
      <button class="btn-ghost" id="btnBindFile" title="选一个文件，之后自动保存到这个文件">绑定保存文件</button>
      <button class="btn-ghost" id="btnExportProg" title="把进度存成文件，换电脑也能接着做">导出</button>
      <button class="btn-ghost" id="btnImportProg" title="从文件恢复进度">导入</button>
      <button class="btn-ghost" id="btnReset" title="清除所有作答记录">重置</button>
      <input type="file" id="fileImport" accept=".json" style="display:none">
    </div>
    <div class="barbg"><div class="barfill" id="hdrBar"></div></div>
  </header>

  <!-- ============ 模式入口 ============ -->
  <div id="modeSwitch" style="display:flex;gap:10px;margin-bottom:16px">
    <button id="modeChoice" class="mode-btn on">
      <b>选择题练习</b>
      <small id="modeChoiceCnt">0 / 400</small>
    </button>
    <button id="modeFill" class="mode-btn">
      <b>填空题练习</b>
      <small id="modeFillCnt">0 / 400</small>
    </button>
    <button id="modeReview" class="mode-btn">
      <b>复习</b>
      <small id="modeReviewCnt">0 张</small>
    </button>
  </div>

  <!-- ============ 做题视图 ============ -->
  <div id="viewQuiz">
    <!-- 专练不会的题：显眼入口 -->
    <button id="btnPracticeMissTop" style="display:none;width:100%;margin-bottom:14px;
      background:linear-gradient(135deg,#dc2626,#b91c1c);border:none;color:#fff;font-weight:700;
      border-radius:12px;padding:13px 18px;font-size:15px;cursor:pointer;
      box-shadow:0 4px 14px rgba(220,38,38,.28);text-align:left">
      <span id="missTopLabel">专练不会的题</span>
      <span style="float:right;opacity:.85;font-weight:400;font-size:13px">点这里 →</span>
    </button>

    <div class="tabs" id="tabs"></div>

    <div class="card" id="qcard">
      <div class="qhead">
        <span class="badge" id="qBadge">单选题</span>
        <span class="qidx" id="qIdx">1 / 400</span>
        <span class="topic" id="qTopic">—</span>
      </div>
      <div class="stem" id="qStem"></div>
      <div class="hint" id="qHint" style="display:none"></div>

      <!-- 填空 / 简答答题区 -->
      <div id="fillArea" style="display:none">
        <div id="fillInputs" style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px"></div>
        <div style="font-size:12.5px;color:var(--muted);margin-bottom:4px" id="fillNote"></div>
        <div style="margin-top:10px">
          <button id="btnShuffleQ" style="padding:5px 12px;font-size:12.5px">打乱题目顺序</button>
        </div>
      </div>

      <div class="opts" id="qOpts"></div>

      <div class="fb" id="fb"></div>

      <div class="actions" id="actNormal">
        <button class="btn-primary" id="btnSubmit">确认答案</button>
        <button id="btnUnsure" title="读完不知道该选哪个 → 记为不会">模棱两可</button>
        <div class="grow"></div>
        <button class="btn-ghost" id="btnSkip">跳过</button>
      </div>

      <div class="actions" id="actReveal" style="display:none">
        <span style="font-size:13.5px;color:var(--muted)">这题你会吗？</span>
        <div class="grow"></div>
      </div>
      <div class="verdicts" id="verdicts" style="display:none">
        <button class="vb" data-v="know"><b>会</b><small>正确选项我已经知道</small></button>
        <button class="vb" data-v="dunno"><b>不会</b><small>知道该选什么，但选错了</small></button>
        <button class="vb" data-v="unsure"><b>模棱两可</b><small>读完了也不知道该选哪个</small></button>
      </div>

      <div class="actions" id="actNext" style="display:none">
        <div class="grow"></div>
        <button class="btn-primary" id="btnNext">下一题 →</button>
      </div>

      <div style="margin-top:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)">
        <label style="display:flex;align-items:center;gap:7px;cursor:pointer">
          <input type="checkbox" id="autoNext" style="width:15px;height:15px;cursor:pointer">
          <span>答完自动跳下一题</span>
        </label>
        <span id="optShuffleWrap" style="display:contents">
          <label style="display:flex;align-items:center;gap:7px;cursor:pointer">
            <input type="checkbox" id="shuffleOpts" style="width:15px;height:15px;cursor:pointer">
            <span>打乱选项顺序</span>
          </label>
          <button id="btnReshuffle" style="padding:3px 10px;font-size:12px">重新打乱</button>
        </span>
      </div>
    </div>

    <div class="navrow" style="margin-top:15px">
      <button id="btnPrev">← 上一题</button>
      <button id="btnGotoMiss" style="display:none">跳到第一道不会的</button>
      <div class="grow" style="flex:1"></div>
      <span class="kbd">1-4 选项</span><span class="kbd">Enter 提交/下一题</span><span class="kbd">U 模棱两可</span>
    </div>
  </div>

  <!-- ============ 复习（闪卡）视图 ============ -->
  <div id="viewReview" style="display:none">
    <div id="reviewHead" style="display:flex;align-items:center;gap:10px;margin-bottom:12px;
         font-size:13px;color:var(--muted)">
      <span id="reviewCount">0 / 0</span>
      <div style="flex:1"></div>
      <span id="reviewHint" style="font-size:12px">点卡片翻面</span>
    </div>

    <!-- 闪卡 -->
    <div id="flashCard" style="position:relative;background:#fff;border:1px solid var(--line);
         border-radius:16px;box-shadow:0 2px 4px rgba(16,24,40,.05),0 8px 28px rgba(16,24,40,.08);
         padding:26px 22px;min-height:240px;cursor:pointer;transition:transform .12s;user-select:none">
      <!-- 正面 -->
      <div id="flashFront">

/* ---------- 选项打乱 ---------- */
// 原始题库答案严重集中在 A/B（A占47.5%、B占42.5%），
// 打乱后可以避免"记字母"而不是记知识点。
// 每题的打乱顺序固定保存在 localStorage，翻回去看顺序不变。
let shuffleMap = null;   // { qid: [原始索引, ...] } 打乱后的显示顺序
let shuffleOn = true;

function buildShuffleMap(force){
  const m = {};
  // 用题干做种子，保证同一道题在任何时候打乱结果一致
  function seedOf(str){
    let h = 2166136261;
    for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  for(const q of QUESTIONS){
    // 种子 = 题干 + （强制重新打乱时的随机盐）
    const salt = force ? Math.random() * 1e9 : 0;
    const rnd = mulberry32(seedOf(q.s) ^ (screen.width * 31) ^ (salt | 0));
    const idx = q.o.map((_, i) => i);
    // Fisher-Yates
    for(let i = idx.length - 1; i > 0; i--){
      const j = Math.floor(rnd() * (i + 1));
      const t = idx[i]; idx[i] = idx[j]; idx[j] = t;
    }
    m[q.i] = idx;
  }
  return m;
}

// 取一道题"打乱后"的选项与答案
function displayOf(q){
  if(!shuffleOn || !shuffleMap || !shuffleMap[q.i]){
    return { opts: q.o.slice(), ans: q.a.split('') };
  }
  const order = shuffleMap[q.i];              // 显示位置 -> 原始索引
  const opts = order.map(oi => q.o[oi]);
  // 原始答案索引集合
  const origIdx = new Set(q.a.split('').map(ch => ch.charCodeAt(0) - 65));
  // 新的答案字母
  const ans = [];
  order.forEach((oi, pos) => { if(origIdx.has(oi)) ans.push(String.fromCharCode(65 + pos)); });
  return { opts, ans: ans.sort() };
}

function saveShuffleMap(){
  try{ localStorage.setItem(LS_SHUFFLE, JSON.stringify({ on: shuffleOn, map: shuffleMap })); }catch(e){}
}

/* ==================== 填空 / 简答模式 ==================== */
const LS_FILLMODE = 'shegong_fillmode';

// 取一道题的填空答案文字（用原始答案，不受打乱影响）
function fillAnswersOf(q){
  return q.a.split('').map(ch => q.o[ch.charCodeAt(0) - 65]);
}

// 宽松标准化：去空格、去标点、全角转半角、数字汉字互通
function normAnswer(s){
  if(s === null || s === undefined) return '';
  let t = String(s);
  // 全角转半角
  t = t.replace(/[\uff01-\uff5e]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xfee0));
  t = t.replace(/\u3000/g, ' ');
  // 去掉所有空白
  t = t.replace(/\s+/g, '');
  // 去掉常见标点
  t = t.replace(/[，,。.、；;：:！!？?"'"'（）()【】\[\]《》<>「」『』—\-_·]/g, '');
  // 数字与汉字互通
  const cn = {'零':'0','一':'1','二':'2','三':'3','四':'4','五':'5','六':'6','七':'7','八':'8','九':'9','十':'10'};
  t = t.replace(/[零一二三四五六七八九十]/g, c => cn[c] || c);
  return t.toLowerCase();
}

// 判断填空答案：
// 单选题 -> 唯一答案；多选题 -> 需答全所有正确项（顺序不限）
function judgeFill(q, inputs){
  const answers = fillAnswersOf(q);
  const got = inputs.map(x => normAnswer(x)).filter(x => x !== '');
  if(!got.length) return { ok:false, reason:'empty' };

  const wanted = answers.map(x => normAnswer(x)).filter(x => x !== '');

  if(q.p === 'single'){
    // 单答案：任一输入等于标准答案即可
    const target = wanted[0] || '';

    // 从题干里提取紧跟在空后面的单位字（如"（ ）年"里的"年"）
    const unitMatch = q.s.match(/（\s*）\s*([年月日天周次人户个元条项年年]|周岁|以上|以下)/);
    const unit = unitMatch ? unitMatch[1] : '';

    for(const g of got){
      if(g === target) return { ok:true };
    }
    // 用户把题干里的单位字一起填了（"5年" vs 标准答案"5"）
    if(unit){
      const unitNorm = normAnswer(unit);
      for(const g of got){
        if(g === target + unitNorm) return { ok:true, loose:true };
        if(g === target + unitNorm + unitNorm) return { ok:true, loose:true };
      }
    }
    // 二次容错：输入里包含答案 或 答案是输入的一部分（长句场景）
    for(const g of got){
      if(target && (g.includes(target) || target.includes(g)) && Math.min(g.length, target.length) >= 2){
        return { ok:true, loose:true };
      }
    }
    // 多个空的情况：全部空都对才算对
    if(wanted.length > 1){
      let all = true;
      wanted.forEach((w, i) => {
        if(!got[i] || got[i] !== w) all = false;
      });
      if(all) return { ok:true };
    }
    return { ok:false };
  }

  // 多选题：每个正确项都要被点到，且不能有错的
  const gotSet = new Set(got);
  let matched = 0;
  const missing = [];
  for(const w of wanted){
    let hit = false;
    for(const g of gotSet){
      if(g === w || (g.includes(w) && w.length >= 2) || (w.includes(g) && g.length >= 2)){ hit = true; break; }
    }
    if(hit) matched++;
    else missing.push(w);
  }
  // 多余的输入（答错了项）
  let extra = 0;
  for(const g of gotSet){
    let isWanted = false;
    for(const w of wanted){
      if(g === w || (g.includes(w) && w.length >= 2) || (w.includes(g) && g.length >= 2)){ isWanted = true; break; }
    }
    if(!isWanted) extra++;
  }
  if(matched === wanted.length && extra === 0) return { ok:true };
  return { ok:false, missing, matched, total: wanted.length, extra };
}

// 渲染填空区
function renderFillArea(q, locked, revealed){
  const area = document.getElementById('fillArea');
  const box = document.getElementById('fillInputs');
  const note = document.getElementById('fillNote');
  if(!area || !box) return;

  // 填空题没有选项，隐藏"打乱选项顺序"，只留"打乱题目顺序"
  const wrap = document.getElementById('optShuffleWrap');
  if(wrap) wrap.style.display = fillMode ? 'none' : 'contents';
  const sq = document.getElementById('btnShuffleQ');
  if(sq) sq.textContent = qOrderMode ? '恢复原顺序' : '打乱题目顺序';

  if(!fillMode){
    area.style.display = 'none';
    box.innerHTML = '';
    return;
  }
  area.style.display = 'block';
  box.innerHTML = '';

  const answers = fillAnswersOf(q);
  const multi = (q.p === 'multi');
  const rec = state.answers[q.i];
  const showAns = !!rec && !(state.tab === 'miss');

  if(multi){
    // 多选 -> 简答：每行一个答案
    const n = Math.max(answers.length, 2);
    const lbl = document.createElement('div');
    lbl.className = 'fill-label';
    lbl.textContent = '简答：按行填写，共 ' + answers.length + ' 个要点（顺序不限，全部答对才算）';
    box.appendChild(lbl);
    for(let i = 0; i < n; i++){
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'fill-input';
      inp.placeholder = '第 ' + (i+1) + ' 个要点';
      inp.autocomplete = 'off';
      inp.spellcheck = false;
      if(showAns){
        inp.value = answers[i] || '';
        inp.disabled = true;
        inp.classList.add('right');
      }
      inp.addEventListener('keydown', ev => {
        if(ev.key === 'Enter'){ ev.preventDefault(); submitFill(); }
      });
      box.appendChild(inp);
    }
    note.textContent = '提示：写关键词即可，不用整句抄。';
  }else{
    // 单选 -> 填空
    const lbl = document.createElement('div');
    lbl.className = 'fill-label';
    lbl.textContent = '填空：写出（ ）里的内容';
    box.appendChild(lbl);
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'fill-input';
    inp.placeholder = '在这里输入答案';
    inp.autocomplete = 'off';
    inp.spellcheck = false;
    if(showAns){
      inp.value = answers[0] || '';
      inp.disabled = true;
      inp.classList.add('right');
    }
    inp.addEventListener('keydown', ev => {
      if(ev.key === 'Enter'){ ev.preventDefault(); submitFill(); }
    });
    box.appendChild(inp);
    note.textContent = '判分比较宽松：标点、空格、数字汉字都算对。';
  }

  // 已答过的题：显示答案
  const oldAns = document.getElementById('fillAnswerBox');
  if(oldAns && oldAns.parentNode) oldAns.parentNode.removeChild(oldAns);

  if(showAns){
    const div = document.createElement('div');
    div.className = 'fill-answer';
    div.id = 'fillAnswerBox';
    div.innerHTML = '正确答案：' + answers.map(a => escapeHtml(a)).join('　|　') +
      '<div class="u" style="margin-top:4px">你填的：' +
      escapeHtml((rec.sel && rec.sel.length ? rec.sel.join(' / ') : '（未填写）')) + '</div>';
    box.appendChild(div);
  }

  // 自动聚焦第一个输入框
  if(!showAns){
    setTimeout(()=>{
      const first = box.querySelector('input:not([disabled])');
      if(first) { try{ first.focus(); }catch(e){} }
    }, 60);
  }
}

// 填空提交
function submitFill(){
  const list = pool();
  const q = list[state.cursor[state.tab] || 0];
  if(!q) return;
  const rec = state.answers[q.i];
  const isRetrain = (state.tab === 'miss');
  if(rec && !isRetrain) return;   // 已锁定

  const inputs = Array.from(document.getElementById('fillInputs').querySelectorAll('input'));
  const vals = inputs.map(i => i.value.trim());

  if(!vals.some(v => v !== '')){
    showToast('还没填答案', 'bad');
    return;
  }

  const r = judgeFill(q, vals);
  markFillVerdict(q, r.ok ? 'know' : 'dunno', vals);

  // 标记输入框颜色
  inputs.forEach(inp => {
    inp.disabled = true;
    inp.classList.add(r.ok ? 'right' : 'wrong');
  });

  if(!r.ok && q.p === 'multi' && r.total){
    showToast('还差 ' + (r.missing ? r.missing.length : 0) + ' 个要点没答对', 'bad', 3000);
  }
  scheduleAutoAdvance(q, !r.ok);
}

// 填空判定写库
function markFillVerdict(q, v, vals){
  state.answers[q.i] = { v: v, sel: (v === 'unsure' || v === 'skip') ? [] : (vals || []).slice() };
  save();
  revealed = true;
  renderQuestion();
}function loadShuffleMap(){
  try{
    const raw = localStorage.getItem(LS_SHUFFLE);
    if(raw){
      const o = JSON.parse(raw);
      if(o && o.map && Object.keys(o.map).length === QUESTIONS.length){
        shuffleMap = o.map;
        shuffleOn = o.on !== false;
        return true;
      }
    }
  }catch(e){}
  return false;
}

const IDB_NAME = 'shegong_qb_handle';
const IDB_STORE = 'handles';
let fileHandle = null;   // 绑定到磁盘上的那个文件

function idbOpen(){
  return new Promise((res, rej)=>{
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = ()=>{ r.result.createObjectStore(IDB_STORE); };
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
  });
}
async function idbSet(key, val){
  const db = await idbOpen();
  return new Promise((res, rej)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = ()=>res(true);
    tx.onerror = ()=>rej(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((res)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const rq = tx.objectStore(IDB_STORE).get(key);
    rq.onsuccess = ()=>res(rq.result);
    rq.onerror = ()=>res(null);
  });
}
function fsSupported(){
  return typeof window !== 'undefined' && 'showSaveFilePicker' in window;
}

// 让用户选一个文件来存进度（只需做一次）
async function bindFile(){
  if(!fsSupported()){
    showToast('这个浏览器不支持文件自动保存，请用 Chrome 或 Edge 打开', 'bad');
    return;
  }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: '我的做题进度.json',
      types: [{ description: '进度文件', accept: {'application/json': ['.json']} }]
    });
    fileHandle = handle;
    await idbSet('progress_file', handle);   // 记住，下次不用再选
    await writeToFile();                      // 立刻写一次当前进度
    showToast('已绑定保存文件，之后每答一题都会自动写入', 'ok');
    renderSaveStatus();
  }catch(e){
    if(e && e.name === 'AbortError') return;  // 用户取消
    showToast('绑定失败：' + (e.message || e.name), 'bad');
  }
}

// 从绑定的文件里读回进度
async function loadFromFile(){
  const h = await idbGet('progress_file');
  if(!h) return false;
  try{
    // 检查权限（浏览器重启后权限会退回 prompt，必须由用户点击才能重新授予）
    let perm = 'prompt';
    try{ perm = await h.queryPermission({mode:'readwrite'}); }catch(e){ perm = 'prompt'; }

    if(perm !== 'granted'){
      // 不能主动弹窗（必须由用户手势触发）：先把句柄挂上，并提示用户点击恢复
      fileHandle = h;
      needsPermission = true;
      showRestoreBanner();
      return false;
    }
    fileHandle = h;
    needsPermission = false;
    hideRestoreBanner();
    const file = await h.getFile();
    const text = await file.text();
    if(text && text.trim()){
      let o = null;
      try{ o = JSON.parse(text); }catch(e){ o = null; }
      // 关键：只有文件里真的有记录时才覆盖内存，避免用空文件把已有进度冲掉
      if(o && o.answers && Object.keys(o.answers).length > 0){
        state.answers = o.answers;
        if(o.cursor) state.cursor = o.cursor;
      }
      if(o && o.savedAt){
        try{
          const d = new Date(o.savedAt);
          if(!isNaN(d.getTime())) lastSaveAt = d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
        }catch(e){}
      }
    }
    return true;
  }catch(e){
    return false;
  }
}

// 需要用户手动授予文件权限（pointer 手势内调用 requestPermission）
let needsPermission = false;
async function restoreFileAccess(){
  if(!fileHandle){
    // 没有句柄：走完整的绑定流程
    await bindFile();
    return;
  }
  try{
    const req = await fileHandle.requestPermission({mode:'readwrite'});
    if(req !== 'granted'){
      showToast('没有获得文件权限，请再点一次「恢复进度」并在弹窗里选允许', 'bad');
      return;
    }
    needsPermission = false;
    hideRestoreBanner();
    // 重新读文件
    const file = await fileHandle.getFile();
    const text = await file.text();
    let o = null;
    try{ o = JSON.parse(text); }catch(e){ o = null; }
    if(o && o.answers && Object.keys(o.answers).length > 0){
      state.answers = o.answers;
      if(o.cursor) state.cursor = o.cursor;
    }
    renderAll();
    showToast('已恢复访问，载入 ' + answeredCount() + ' 条记录', 'ok');
  }catch(e){
    showToast('恢复失败：' + (e.message || e.name), 'bad');
  }
}

function showRestoreBanner(){
  let b = document.getElementById('restoreBar');
  if(!b){
    b = document.createElement('div');
    b.id = 'restoreBar';
    b.style.cssText = 'position:fixed;left:50%;top:0;transform:translateX(-50%);z-index:999;'+
      'background:#fef4e6;border:1px solid #fde68a;border-bottom-left-radius:12px;border-bottom-right-radius:12px;'+
      'padding:11px 20px;font-size:13.5px;color:#92400e;display:flex;align-items:center;gap:12px;'+
      'box-shadow:0 6px 22px rgba(0,0,0,.12);max-width:96vw;flex-wrap:wrap';
    b.innerHTML = '<span>浏览器重启后需要重新授权才能读取保存文件</span>'+
      '<button id="btnRestoreAccess" style="background:#d97706;border:none;color:#fff;font-weight:700;'+
      'padding:6px 16px;border-radius:8px;font-size:13px;cursor:pointer">点此恢复进度</button>';
    document.body.appendChild(b);
    b.querySelector('#btnRestoreAccess').onclick = restoreFileAccess;
  }
  b.style.display = 'flex';
}
function hideRestoreBanner(){
  const b = document.getElementById('restoreBar');
  if(b) b.style.display = 'none';
}

// 把当前进度写进绑定的文件
async function writeToFile(){
  if(!fileHandle) return false;
  try{
    const perm = await fileHandle.queryPermission({mode:'readwrite'});
    if(perm !== 'granted'){
      const req = await fileHandle.requestPermission({mode:'readwrite'});
      if(req !== 'granted'){
        showToast('文件写入权限被拒绝，点「绑定保存文件」重新选', 'bad');
        return false;
      }
    }
    const payload = JSON.stringify({
      answers: state.answers,
      cursor: state.cursor,
      savedAt: new Date().toISOString()
    }, null, 1);
    const w = await fileHandle.createWritable();
    await w.write(payload);
    await w.close();
    lastSaveAt = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    storageOK = true;
    renderSaveStatus();
    return true;
  }catch(e){
    showToast('写入文件失败：' + (e.message || e.name), 'bad');
    return false;
  }
}

/* ---------- persistence ---------- */
function trySet(key, val){
  try{ localStorage.setItem(key, val); return true; }
  catch(e){ return false; }
}
function tryGet(key){
  try{ return localStorage.getItem(key); }
  catch(e){ return null; }
}

// 检测是否运行在本地服务器上（磁盘自动保存模式）
// 注意：file:// 协议下直接跳过，避免无谓的网络请求和超时等待
function detectMode(){
  try{
    if(typeof location !== 'undefined' && location.protocol !== 'http:' && location.protocol !== 'https:'){
      return Promise.resolve(false);
    }
  }catch(e){ return Promise.resolve(false); }

  // 加超时：手机端连不上时不要卡住页面
  return new Promise(resolve => {
    const done = () => resolve(false);
    const timer = setTimeout(done, 800);
    fetch('/api/ping', {cache:'no-store'})
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(j => { clearTimeout(timer); resolve(j && j.ok === true); })
      .catch(() => { clearTimeout(timer); resolve(false); });
  });
}

function load(){
  if(diskMode){
    // 磁盘模式：从服务器读
    return fetch('/api/progress', {cache:'no-store'})
      .then(r => r.json())
      .then(o => {
        if(o && o.answers) state.answers = o.answers;
        if(o && o.cursor) state.cursor = o.cursor;
        if(o && o.savedAt){
          const d = new Date(o.savedAt);
          lastSaveAt = d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
        }
        storageOK = true;
        renderAll();
        const n = answeredCount();
        if(n > 0) showToast('已自动载入 ' + n + ' 条记录', 'ok');
      })
      .catch(() => { storageOK = false; renderAll(); });
  }

  // 先探一次存储是否可用
  if(!trySet(LS_TS, 'probe')) storageOK = false;

  loadFromLocalStorageOnly();

  const ts = tryGet(LS_TS);
  if(ts && ts !== 'probe'){ lastSaveAt = ts; }
}

// 只从浏览器存储读取（不碰文件）
function loadFromLocalStorageOnly(){
  if(!trySet(LS_TS, 'probe')) storageOK = false;

  let o = null;
  const raw = tryGet(lsKey());
  if(raw){
    try{ o = JSON.parse(raw); }catch(e){ o = null; }
  }
  // 主存储坏了或无数据 -> 用备份
  if((!o || !o.answers || Object.keys(o.answers).length === 0)){
    const bak = tryGet(lsBakKey());
    if(bak){
      try{
        const b = JSON.parse(bak);
        if(b && b.answers && Object.keys(b.answers).length > 0){
          o = b;
          setTimeout(()=>showToast('已从浏览器备份恢复 ' + Object.keys(b.answers).length + ' 条记录', 'ok'), 600);
        }
      }catch(e){}
    }
  }
  // 只有浏览器里确实有数据时才覆盖
  if(o && o.answers && Object.keys(o.answers).length > 0){
    state.answers = o.answers;
    if(o.cursor) state.cursor = o.cursor;
  }
}

function save(){
  const payload = JSON.stringify({answers: state.answers, cursor: state.cursor});
  const ts = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});

  // 优先级 1：已绑定磁盘文件 -> 直接写入文件
  if(fileHandle){
    // 安全闸：还没拿到权限、且内存里没有记录时，绝不写盘，
    // 否则会用空数据覆盖文件里已有的进度
    if(needsPermission && answeredCount() === 0){
      return;
    }
    if(saveInFlight){ pendingSave = true; return; }
    saveInFlight = true;
    writeToFile().then(ok => {
      saveInFlight = false;
      if(pendingSave){ pendingSave = false; save(); }
    });
    return;
  }

  if(diskMode){
    // 磁盘模式：POST 到本地服务器，自动写入 json 文件
    if(saveInFlight){ pendingSave = true; return; }
    saveInFlight = true;
    fetch('/api/progress', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: payload
    }).then(r => r.ok ? r.json() : Promise.reject(new Error('服务器返回 '+r.status)))
      .then(j => {
        if(!j.ok) throw new Error(j.error || '未知错误');
        lastSaveAt = ts;
        storageOK = true;
        saveInFlight = false;
        renderSaveStatus();
        if(pendingSave){ pendingSave = false; save(); }
      })
      .catch(e => {
        storageOK = false;
        saveInFlight = false;
        showToast('⚠️ 磁盘保存失败：' + e.message + '。进度只存在页面里。', 'bad', 0);
        renderSaveStatus();
      });
    return;
  }

  // 优先级 3：浏览器存储模式（兜底）
  const a = trySet(lsKey(), payload);
  const b = trySet(lsBakKey(), payload);
  if(a || b){
    trySet(LS_TS, ts);
    lastSaveAt = ts;
    storageOK = true;
  }else{
    // 存不进去，必须让用户知道，不能像以前那样静默吞掉
    if(storageOK){
      storageOK = false;
      showToast('⚠️ 浏览器不让保存！进度只存在页面里，关掉就没了。', 'bad', 0);
    }
  }
  renderSaveStatus();
  // 触发 GitHub 同步（延迟合并）
  if(typeof ghSchedulePush === 'function') ghSchedulePush();
}

function renderAll(){
  renderHeader(); renderTabs(); renderQuestion(); renderSaveStatus();
  if(typeof renderModeButtons === 'function') renderModeButtons();
  const be = document.getElementById('btnExportProg');
  const bi = document.getElementById('btnImportProg');
  const bb = document.getElementById('btnBindFile');
  // 绑定文件后，导出/导入就不需要了
  const hidden = diskMode || !!fileHandle;
  if(be) be.style.display = hidden ? 'none' : '';
  if(bi) bi.style.display = hidden ? 'none' : '';
  // 手机浏览器不支持文件绑定，直接隐藏这个按钮
  if(bb) bb.style.display = (!fsSupported() || diskMode || !!fileHandle) ? 'none' : '';
}

function renderSaveStatus(){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  if(needsPermission){
    el.textContent = '⚠️ 需授权才能读写文件';
    el.style.color = 'var(--mid)';
    el.style.fontWeight = '700';
  }else if(!storageOK){
    el.textContent = '⚠️ 保存失败';
    el.style.color = 'var(--bad)';
    el.style.fontWeight = '700';
  }else if(fileHandle && lastSaveAt){
    el.textContent = '✓ 已自动写入文件 ' + lastSaveAt;
    el.style.color = 'var(--ok)';
    el.style.fontWeight = '600';
  }else if(diskMode && lastSaveAt){
    el.textContent = '✓ 已自动保存到文件 ' + lastSaveAt;
    el.style.color = 'var(--ok)';
    el.style.fontWeight = '600';
  }else if(fileHandle){
    el.textContent = '文件已绑定';
    el.style.color = 'var(--ok)';
    el.style.fontWeight = '600';
  }else if(lastSaveAt){
    el.textContent = '已保存 ' + lastSaveAt;
    el.style.color = 'var(--muted)';
    el.style.fontWeight = '400';
  }else{
    el.textContent = '';
  }
}

function exportProgress(){
  const payload = JSON.stringify({
    app: 'shegong_qb', version: 1,
    savedAt: new Date().toISOString(),
    answers: state.answers,
    cursor: state.cursor
  }, null, 1);
  const blob = new Blob([payload], {type:'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const el = document.createElement('a');
  const d = new Date();
  const stamp = '' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0')
    + '-' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0');
  el.href = url; el.download = '题库进度-' + stamp + '.json';
  document.body.appendChild(el); el.click();
  document.body.removeChild(el);
  URL.revokeObjectURL(url);
  showToast('进度已导出为文件，放到安全的地方', 'ok');
}

function importProgress(file){
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const o = JSON.parse(reader.result);
      if(!o || !o.answers) throw new Error('文件里没有做题记录');
      const n = Object.keys(o.answers).length;
      if(!confirm('要导入这份进度吗？共 ' + n + ' 条记录。\n当前页面已有 ' + answeredCount() + ' 条，导入后会覆盖。')) return;
      state.answers = o.answers;
      if(o.cursor) state.cursor = o.cursor;
      save();
      renderTabs(); renderQuestion(); renderHeader();
      showToast('已导入 ' + n + ' 条记录', 'ok');
    }catch(e){
      showToast('导入失败：' + e.message, 'bad');
    }
  };
  reader.readAsText(file, 'utf-8');
}

/* ---------- toast ---------- */
let toastTimer = null;
function showToast(msg, type, duration){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:999;'+
      'padding:11px 20px;border-radius:10px;font-size:13.5px;font-weight:600;max-width:92vw;'+
      'box-shadow:0 8px 26px rgba(0,0,0,.18);transition:opacity .25s';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.background = type==='bad' ? '#fdeceb' : (type==='ok' ? '#e7f7ee' : '#eef1f5');
  el.style.color = type==='bad' ? '#b91c1c' : (type==='ok' ? '#15803d' : '#475569');
  el.style.border = '1px solid ' + (type==='bad' ? '#fecaca' : (type==='ok' ? '#bbf7d0' : '#dbe2ea'));
  el.style.opacity = '1';
  if(toastTimer) clearTimeout(toastTimer);
  if(duration !== 0){
    toastTimer = setTimeout(()=>{ el.style.opacity='0'; }, duration || 2600);
  }
}

/* ---------- helpers ---------- */
function topicShort(t){
  let s = t.replace(/^[一二三四五六七八九十]+、/,'').replace(/（[^）]*）/,'').replace(/《|》/g,'');
  // 标签栏里用简称，避免横向滚动太长
  s = s.replace(/^中华人民共和国/, '').replace(/^中共中央\s*国务院关于/, '');
  const map = {
    '城市居民委员会组织法': '居委会组织法',
    '社会工作者职业资格考试核心知识': '社工核心知识',
    '基层矛盾纠纷化解实务': '矛盾化解实务',
    '加强新时代社会工作的意见': '新时代社工意见',
    '树立和践行正确政绩观': '正确政绩观'
  };
  return map[s] || s;
}
// 「不会的」包含：不会、模棱两可、跳过（跳过 = 暂时不答，以后还要练）
function isMissRecord(a){
  return !!a && (a.v === 'dunno' || a.v === 'unsure' || a.v === 'skip');
}
function missList(){
  return QUESTIONS.filter(q => isMissRecord(state.answers[q.i]));
}

// 题目顺序打乱（仅影响显示顺序，不影响题目内容）
let qOrderMode = false;        // 是否已打乱题目顺序
let qOrder = null;             // 打乱后的题号顺序数组

function pool(){
  const tab = state.tab;
  let base;
  if(tab === 'all') base = QUESTIONS;
  else if(tab === 'single') base = QUESTIONS.filter(q=>q.p==='single');
  else if(tab === 'multi') base = QUESTIONS.filter(q=>q.p==='multi');
  else if(tab === 'miss') base = missList();
  else base = QUESTIONS.filter(q=>q.t===tab);

  // 打过乱题目顺序：按 qOrder 里的顺序重排
  if(qOrderMode && qOrder && qOrder.length){
    const idx = {};
    qOrder.forEach((qid, i) => { idx[qid] = i; });
    base = base.slice().sort((a, b) => {
      const ia = (a.i in idx) ? idx[a.i] : 999999;
      const ib = (b.i in idx) ? idx[b.i] : 999999;
      return ia - ib;
    });
  }
  return base;
}

// 打乱题目顺序
function shuffleQuestionOrder(){
  const list = pool();
  if(list.length <= 1){
    showToast('题目太少，不用打乱', 'ok', 1600);
    return;
  }
  const ids = list.map(q => q.i);
  for(let i = ids.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = ids[i]; ids[i] = ids[j]; ids[j] = t;
  }
  // 如果之前有完整顺序，保留未出现在当前 pool 的题
  const allIds = QUESTIONS.map(q => q.i).filter(id => !ids.includes(id));
  qOrder = ids.concat(allIds);
  qOrderMode = true;
  state.cursor = state.cursor || {};
  state.cursor[state.tab] = 0;
  renderQuestion();
  showToast('题目顺序已打乱', 'ok', 1800);
}

// 恢复原始顺序
function restoreQuestionOrder(){
  qOrderMode = false;
  qOrder = null;
  state.cursor = state.cursor || {};
  state.cursor[state.tab] = 0;
  renderQuestion();
  showToast('已恢复原始顺序', 'ok', 1800);
}
function topics(){
  const seen = [];
  for(const q of QUESTIONS){ if(!seen.includes(q.t)) seen.push(q.t); }
  return seen;
}
function answeredCount(){
  return Object.keys(state.answers).length;
}
function isCorrect(q, sel){
  if(!sel || !sel.length) return false;
  const disp = displayOf(q);
  const a = disp.ans.slice().sort().join('');
  const s = sel.slice().sort().join('');
  return a === s;
}

/* ---------- header ---------- */
function renderHeader(){
  const done = answeredCount();
  document.getElementById('hdrProg').textContent = done + ' / ' + QUESTIONS.length;
  document.getElementById('hdrBar').style.width = (100*done/QUESTIONS.length).toFixed(1) + '%';
}

/* ---------- tabs ---------- */
function renderTabs(){
  const el = document.getElementById('tabs');
  const missN = missList().length;
  const tabs = [
    {k:'all',    label:'全部 '+QUESTIONS.length},
    {k:'single', label:'单选题 '+QUESTIONS.filter(q=>q.p==='single').length},
    {k:'multi',  label:'多选题 '+QUESTIONS.filter(q=>q.p==='multi').length},
    {k:'miss',   label:'不会的 '+missN}
  ];
  for(const t of topics()) tabs.push({k:t, label:topicShort(t)});

  el.innerHTML = '';
  for(const t of tabs){
    const b = document.createElement('div');
    b.className = 'tab' + (state.tab===t.k ? ' on' : '');
    b.textContent = t.label;
    b.onclick = ()=>{ state.tab = t.k; renderTabs(); renderQuestion(); };
    el.appendChild(b);
  }
}

/* ---------- question render ---------- */
let curSel = [];       // current selection for the shown question
let revealed = false;  // answer already judged / shown

function renderQuestion(jumpToMiss){
  const list = pool();
  const wrap = document.getElementById('qcard');
  renderHeader(); renderTabs();

  if(list.length === 0){
    const isMiss = state.tab === 'miss';
    document.getElementById('qBadge').textContent = '—';
    document.getElementById('qIdx').textContent = '0 / 0';
    document.getElementById('qTopic').textContent = '—';
    document.getElementById('qStem').textContent = isMiss
      ? '不会的题都答对了，真棒 🎉'
      : '这个分类下面没有题。';
    document.getElementById('qOpts').innerHTML = '';
    document.getElementById('qOpts').style.display = '';
    document.getElementById('qHint').style.display='none';
    document.getElementById('fb').className='fb';
    document.getElementById('actNormal').style.display='none';
    document.getElementById('verdicts').style.display='none';
    document.getElementById('actNext').style.display='none';
    document.getElementById('actReveal').style.display='none';

    // 关键：清空并隐藏填空输入区，否则会残留输入框
    const fArea = document.getElementById('fillArea');
    if(fArea){ fArea.style.display = 'none'; }
    const fBox = document.getElementById('fillInputs');
    if(fBox){ fBox.innerHTML = ''; }
    const oldA = document.getElementById('fillAnswerBox');
    if(oldA && oldA.parentNode) oldA.parentNode.removeChild(oldA);

    hideAutoHint();
    cancelAutoAdvance();
    renderMissEntry();
    return;
  }

  // decide cursor
  let idx = state.cursor[state.tab] || 0;
  if(idx >= list.length) idx = list.length - 1;
  if(idx < 0) idx = 0;
  if(jumpToMiss){
    // first unanswered or unsure in this pool
    let found = -1;
    for(let k=0;k<list.length;k++){
      const a = state.answers[list[k].i];
      if(!a || a.v==='dunno' || a.v==='unsure' || a.v==='skip'){ found = k; break; }
    }
    idx = found >= 0 ? found : 0;
  }
  state.cursor[state.tab] = idx;
  const q = list[idx];

  const rec = state.answers[q.i];

  // header bits
  const badge = document.getElementById('qBadge');
  badge.textContent = q.p === 'single' ? '单选题' : '多选题';
  badge.className = 'badge ' + q.p;
  document.getElementById('qIdx').textContent = (idx+1) + ' / ' + list.length;
  document.getElementById('qTopic').textContent = topicShort(q.t);
  document.getElementById('qStem').textContent = q.s;

  // hint for multi
  const hint = document.getElementById('qHint');
  const correctCount = q.a.length;
  if(q.p === 'multi'){
    hint.style.display='block';
    hint.className='hint warn';
    hint.textContent = '多选题：至少两个正确选项，全部选对才算"会"。';
    if(state.tab === 'miss'){
      hint.textContent += '　答对就移出「不会的」列表。';
    }
  }else{
    if(state.tab === 'miss'){
      hint.style.display='block';
      hint.className='hint';
      hint.textContent = '答对就移出「不会的」列表，剩下 ' + list.length + ' 题。';
    }else{
      hint.style.display='none';
    }
  }

  // previous judgement: if already answered, show the outcome and lock
  // 专练模式：清空上次的选择，让你从头做
  const isRetrainTab = (state.tab === 'miss');
  curSel = (rec && !isRetrainTab) ? (rec.sel || []).slice() : [];
  revealed = false;

  const opts = document.getElementById('qOpts');
  opts.innerHTML = '';

  // if previously answered with a verdict -> show locked state
  // 专练模式（miss）：不锁定，允许重新作答
  const retrain = (state.tab === 'miss');
  const locked = !!rec && !retrain;
  if(locked){
    revealed = true;
  }
  if(!retrain && rec && rec.v === 'unsure'){
    // unsure: no selection was made; reveal correct answer
    revealed = true;
  }

  // 打乱后的选项与答案
  const disp = displayOf(q);
  const correctSet = disp.ans;

  // ---------- 填空模式：渲染输入框，隐藏选项 ----------
  renderFillArea(q, locked, revealed);
  if(fillMode){
    opts.style.display = 'none';
    // 填空题的按钮文案
    const btnS = document.getElementById('btnSubmit');
    if(btnS) btnS.textContent = '提交答案';
    const btnU = document.getElementById('btnUnsure');
    if(btnU) btnU.title = '想不起来 → 记为不会';
  }else{
    opts.style.display = '';
  }

  disp.opts.forEach((text, i)=>{
    const letter = String.fromCharCode(65+i);
    const div = document.createElement('div');
    div.className = 'opt' + (locked ? ' locked' : '');
    const selected = curSel.includes(letter);
    if(revealed){
      if(correctSet.includes(letter)) div.classList.add('right');
      else if(selected) div.classList.add('wrong');
    }else if(selected){
      div.classList.add('sel');
    }
    div.innerHTML = '<div class="k">'+letter+'</div><div class="otext">'+escapeHtml(text)+
      (revealed && correctSet.includes(letter) ? '<span class="mark ok">✓ 正确答案</span>' : '') +
      (revealed && selected && !correctSet.includes(letter) ? '<span class="mark no">✗ 你选的</span>' : '') +
      '</div>';
    if(!locked){
      div.onclick = ()=>{
        if(q.p === 'single'){
          // 单选：点一下立即判分
          curSel = [letter];
          refreshOptClasses(q);
          const okNow = correctSet.includes(letter);
          markVerdict(q, okNow ? 'know' : 'dunno', [letter]);
          scheduleAutoAdvance(q, !okNow);
          return;
        }
        // 多选：累加，等用户确认
        const k = curSel.indexOf(letter);
        if(k>=0) curSel.splice(k,1); else curSel.push(letter);
        curSel.sort();
        refreshOptClasses(q);
        updateSubmitState(q);
      };
    }
    opts.appendChild(div);
  });

  // feedback
  const fb = document.getElementById('fb');
  fb.className = 'fb';
  fb.textContent = '';

  const actNormal = document.getElementById('actNormal');
  const verdicts = document.getElementById('verdicts');
  const actNext = document.getElementById('actNext');
  const actReveal = document.getElementById('actReveal');
  const btnGotoMiss = document.getElementById('btnGotoMiss');

  if(!locked){
    actNormal.style.display = 'flex';
    verdicts.style.display = 'none';
    actNext.style.display = 'none';
    actReveal.style.display = 'none';
    updateSubmitState(q);
  }else{
    actNormal.style.display = 'none';
    verdicts.style.display = 'flex';
    actNext.style.display = 'flex';
    actReveal.style.display = 'none';

    // show verdict feedback
    const ansText = disp.ans.join('、');
    if(rec.v === 'know'){
      fb.className = 'fb ok show';
      fb.textContent = '✓ 标记为「会」· 正确答案 ' + ansText;
    }else if(rec.v === 'dunno'){
      fb.className = 'fb bad show';
      fb.textContent = '✗ 标记为「不会」· 正确答案 ' + ansText +
        (rec.sel && rec.sel.length ? '（你选了 ' + rec.sel.join('、') + '）' : '');
    }else if(rec.v === 'unsure'){
      fb.className = 'fb unsure show';
      fb.textContent = '? 标记为「模棱两可」· 正确答案 ' + ansText;
    }else if(rec.v === 'skip'){
      fb.className = 'fb show';
      fb.style.background='#eef1f5'; fb.style.color='#64748b';
      fb.textContent = '已跳过（未标记）';
    }

    // allow re-marking
    verdicts.querySelectorAll('.vb').forEach(b=>{
      b.style.outline = (b.dataset.v === rec.v) ? '2.5px solid var(--brand)' : 'none';
      b.onclick = ()=>{ markVerdict(q, b.dataset.v); scheduleAutoAdvance(q, b.dataset.v !== 'know'); };
    });

    // 单选：已经答过的题通常是从列表翻回来的，不自动跳
    // 刚答完的会走 scheduleAutoAdvance
  }

  // goto-miss button
  btnGotoMiss.style.display = 'none';   // 统一用上面的醒目入口
  btnGotoMiss.onclick = ()=>{ state.tab='miss'; renderTabs(); renderQuestion(true); };

  renderMissEntry();

  document.getElementById('btnPrev').disabled = (idx === 0 && list.length === 0);
  window.scrollTo({top:0, behavior:'smooth'});
}

// 「专练不会的题」大入口
function renderMissEntry(){
  const btn = document.getElementById('btnPracticeMissTop');
  const lbl = document.getElementById('missTopLabel');
  if(!btn || !lbl) return;
  const missN = missList().length;
  // 其中有多少是"跳过"的
  const skipN = QUESTIONS.filter(q=>{const a=state.answers[q.i];return a && a.v==='skip';}).length;

  if(state.tab === 'miss'){
    btn.style.display = 'block';
    if(missN > 0){
      lbl.textContent = '正在专练不会的题 · 还剩 ' + missN + ' 道';
    }else{
      lbl.textContent = '不会的题都答对了，真棒';
    }
    btn.style.background = 'linear-gradient(135deg,#16a34a,#15803d)';
    btn.style.boxShadow = '0 4px 14px rgba(22,163,74,.28)';
  }else if(missN > 0){
    btn.style.display = 'block';
    lbl.textContent = '专练不会的题（' + missN + ' 道'
      + (skipN > 0 ? '，含跳过 ' + skipN + ' 道' : '') + '）';
    btn.style.background = 'linear-gradient(135deg,#dc2626,#b91c1c)';
    btn.style.boxShadow = '0 4px 14px rgba(220,38,38,.28)';
  }else{
    btn.style.display = 'none';
  }
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function refreshOptClasses(q){
  const nodes = document.getElementById('qOpts').children;
  const disp = displayOf(q);
  disp.opts.forEach((_, i)=>{
    const letter = String.fromCharCode(65+i);
    if(nodes[i]) nodes[i].classList.toggle('sel', curSel.includes(letter));
  });
}

function updateSubmitState(q){
  const btn = document.getElementById('btnSubmit');
  if(!btn) return;
  if(fillMode){
    // 填空模式：永远可点（提交时再检查是否为空）
    btn.disabled = false;
    btn.textContent = '提交答案';
    return;
  }
  if(q.p === 'multi'){
    btn.disabled = curSel.length === 0;
    btn.textContent = curSel.length ? '确认答案（已选 '+curSel.length+' 个）' : '确认答案';
  }else{
    btn.disabled = curSel.length === 0;
    btn.textContent = '确认答案';
  }
}

/* ---------- judgement flow ---------- */
function submitAnswer(){
  const list = pool();
  const q = list[state.cursor[state.tab] || 0];
  if(!q || !curSel.length) return;

  const ok = isCorrect(q, curSel);
  if(ok){
    markVerdict(q, 'know', curSel);
  }else{
    markVerdict(q, 'dunno', curSel);
  }
  scheduleAutoAdvance(q, !ok);
}

function markVerdict(q, v, sel){
  const useSel = sel !== undefined ? sel : (state.answers[q.i] ? state.answers[q.i].sel : curSel);
  state.answers[q.i] = { v: v, sel: (v === 'unsure' || v === 'skip') ? [] : (useSel||[]).slice() };
  save();

  // reveal
  revealed = true;
  const disp = displayOf(q);
  const correctSet = disp.ans;
  const nodes = document.getElementById('qOpts').children;
  const chosen = state.answers[q.i].sel;
  disp.opts.forEach((_, i)=>{
    const letter = String.fromCharCode(65+i);
    const div = nodes[i];
    if(!div) return;
    div.className = 'opt locked';
    if(correctSet.includes(letter)) div.classList.add('right');
    else if(chosen.includes(letter)) div.classList.add('wrong');
  });
  renderQuestion();
}

// 自动跳下一题（停顿片刻，让你看清对错/答案）
let autoTimer = null;
function scheduleAutoAdvance(fromQ, isWrong){
  if(autoTimer) clearTimeout(autoTimer);
  if(autoCountTimer) clearInterval(autoCountTimer);
  const fast = document.getElementById('autoNext') && document.getElementById('autoNext').checked;
  if(!fast){ hideAutoHint(); return; }

  // 答错/跳过要看答案，停久一点；答对停短一点
  const wrong = (isWrong === true);
  const delay = wrong ? 4500 : 900;

  showAutoHint(delay, wrong);

  autoTimer = setTimeout(()=>{
    autoTimer = null;
    if(autoCountTimer){ clearInterval(autoCountTimer); autoCountTimer = null; }
    hideAutoHint();
    // 在「不会的」模式里：如果刚答的这题已经从池子里移走了，
    // 光标位置本身就已经指向"下一题"，不要再 +1，否则会跳过一道
    if(state.tab === 'miss' && fromQ){
      const still = pool().some(q => q.i === fromQ.i);
      if(!still){
        renderQuestion();
        return;
      }
    }
    nextQuestion();
  }, delay);
}
function cancelAutoAdvance(){
  if(autoTimer){ clearTimeout(autoTimer); autoTimer = null; }
  if(autoCountTimer){ clearInterval(autoCountTimer); autoCountTimer = null; }
  hideAutoHint();
}

// 自动跳题倒计时提示
let autoCountTimer = null;
function showAutoHint(ms, wrong){
  let el = document.getElementById('autoHint');
  if(!el){
    el = document.createElement('div');
    el.id = 'autoHint';
    el.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;'+
      'padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;'+
      'box-shadow:0 6px 20px rgba(0,0,0,.18);display:flex;align-items:center;gap:10px;'+
      'background:#fff;border:1px solid var(--line);color:var(--ink)';
    document.body.appendChild(el);
  }
  let left = Math.ceil(ms / 1000);
  const render = ()=>{
    el.innerHTML = (wrong
        ? '<span style="color:#b91c1c">✗ 答错了，看清答案</span>'
        : '<span style="color:#15803d">✓ 答对了</span>')
      + ' <span style="color:var(--muted);font-weight:400">' + left + ' 秒后下一题</span>'
      + ' <button id="autoPauseBtn" style="padding:4px 12px;border-radius:99px;font-size:12px;'+
        'background:var(--brand);color:#fff;border:none;font-weight:600;cursor:pointer">停</button>';
    const b = document.getElementById('autoPauseBtn');
    if(b) b.onclick = cancelAutoAdvance;
  };
  render();
  el.style.display = 'flex';

  if(autoCountTimer) clearInterval(autoCountTimer);
  autoCountTimer = setInterval(()=>{
    left--;
    if(left <= 0){ clearInterval(autoCountTimer); autoCountTimer = null; return; }
    render();
  }, 1000);
}
function hideAutoHint(){
  const el = document.getElementById('autoHint');
  if(el) el.style.display = 'none';
}

function markUnsure(){
  const list = pool();
  const q = list[state.cursor[state.tab] || 0];
  if(!q) return;
  markVerdict(q, 'unsure', []);
}

function nextQuestion(){
  const list = pool();
  let idx = state.cursor[state.tab] || 0;
  idx++;
  if(idx >= list.length){ idx = list.length - 1; }
  state.cursor[state.tab] = idx;
  renderQuestion();
  // auto-advance past answered ones
  autoSkipAnswered();
}

function prevQuestion(){
  const list = pool();
  let idx = state.cursor[state.tab] || 0;
  idx = Math.max(0, idx-1);
  state.cursor[state.tab] = idx;
  renderQuestion();
}

function autoSkipAnswered(){
  // if current already answered and user is navigating with Next, keep it; do nothing
}

/* ---------- summary ---------- */
function renderSummary(){
  document.getElementById('viewQuiz').style.display='none';
  document.getElementById('viewSummary').style.display='block';

  const total = QUESTIONS.length;
  const done = answeredCount();
  const know = [], dunno = [], unsure = [], skip = [];
  for(const q of QUESTIONS){
    const a = state.answers[q.i];
    if(!a){ continue; }
    if(a.v==='know') know.push(q);
    else if(a.v==='dunno') dunno.push(q);
    else if(a.v==='unsure') unsure.push(q);
    else if(a.v==='skip') skip.push(q);
  }

  document.getElementById('sumMeta').textContent =
    '共 ' + total + ' 题 · 已作答 ' + done + ' 题 · 未作答 ' + (total-done) + ' 题';
  document.getElementById('sumStats').innerHTML =
    '<div class="stat ko"><div class="num">'+know.length+'</div><div class="lbl">会</div></div>' +
    '<div class="stat ba"><div class="num">'+(dunno.length+unsure.length)+'</div><div class="lbl">不会（含模棱两可 '+unsure.length+'）</div></div>' +
    '<div class="stat un"><div class="num">'+skip.length+'</div><div class="lbl">跳过</div></div>' +
    '<div class="stat"><div class="num">'+(total-done)+'</div><div class="lbl">还没做</div></div>';

  // by topic
  const rows = [];
  rows.push('<table><thead><tr><th>专题</th><th class=c>会</th><th class=c>不会</th><th class=c>模棱两可</th><th class=c>未做</th><th class=c>不会率</th></tr></thead><tbody>');
  function rowFor(title, list){
    let ok=0,no=0,un=0,un_done=0,un_left=0;
    for(const q of list){
      const a = state.answers[q.i];
      if(!a){ un_left++; continue; }
      if(a.v==='know') ok++;
      else if(a.v==='dunno') no++;
      else if(a.v==='unsure') un++;
    }
    const denom = ok+no+un;
    const rate = denom ? ((no+un)/denom*100) : null;
    const cls = rate===null ? 'ze' : (rate>=50?'ba':(rate>0?'un':'ok'));
    return '<tr><td>'+escapeHtml(title)+'</td><td class=c><span class="pill ok">'+ok+'</span></td>'+
      '<td class=c><span class="pill ba">'+no+'</span></td>'+
      '<td class=c><span class="pill un">'+un+'</span></td>'+
      '<td class=c><span class="pill ze">'+un_left+'</span></td>'+
      '<td class=c><span class="pill '+cls+'">'+(rate===null?'—':rate.toFixed(0)+'%')+'</span></td></tr>';
  }
  for(const t of topics()){
    let list = QUESTIONS.filter(q=>q.t===t);
    rows.push(rowFor(topicShort(t), list));
  }
  rows.push(rowFor('【合计】', QUESTIONS));
  rows.push('</tbody></table>');
  document.getElementById('sumTopics').innerHTML = rows.join('');

  // miss list
  const miss = missList();
  document.getElementById('sumMissMeta').textContent =
    miss.length ? ('共 '+miss.length+' 道（含跳过的）。建议专练这一批。') : '没有不会的题（或还没做完）。';
  const ml = document.getElementById('sumMiss');
  if(!miss.length){
    ml.innerHTML = '<div class="empty"><div class="big">✓</div>暂时没有需要攻的题</div>';
  }else{
    ml.innerHTML = miss.map(q=>{
      const a = state.answers[q.i];
      const tagCls = a.v==='unsure' ? 'u' : (a.v==='skip' ? 'u' : 'b');
      const tagTxt = a.v==='unsure' ? '模棱两可' : (a.v==='skip' ? '跳过' : '不会');
      return '<div class="miss"><div class="no">'+q.i+'</div>'+
        '<div class="q">'+escapeHtml(q.s)+'<span class="ans">答案 '+displayOf(q).ans.join('、')+'</span></div>'+
        '<span class="tag '+tagCls+'">'+tagTxt+'</span></div>';
    }).join('');
  }
  document.getElementById('btnPracticeMiss').disabled = miss.length===0;
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- export ---------- */
function exportTxt(){
  const total = QUESTIONS.length;
  const know=[],dunno=[],unsure=[],skip=[];
  for(const q of QUESTIONS){
    const a=state.answers[q.i]; if(!a) continue;
    ({know,dunno,unsure,skip})[ {know:'know',dunno:'dunno',unsure:'unsure',skip:'skip'}[a.v] ].push(q);
  }
  const L=[];
  L.push('社工大赛题库练习总结');
  L.push('生成时间：'+new Date().toLocaleString('zh-CN'));
  L.push('');
  L.push('总题数：'+total+'   已作答：'+answeredCount());
  L.push('会：'+know.length+'    不会：'+dunno.length+'    模棱两可：'+unsure.length+'    跳过：'+skip.length);
  L.push('');
  L.push('=== 按专题 ===');
  for(const t of topics()){
    const list = QUESTIONS.filter(q=>q.t===t);
    let ok=0,no=0,un=0,left=0;
    for(const q of list){ const a=state.answers[q.i]; if(!a){left++;continue;}
      if(a.v==='know')ok++; else if(a.v==='dunno')no++; else if(a.v==='unsure')un++; }
    const d=ok+no+un;
    L.push('【'+topicShort(t)+'】会 '+ok+' | 不会 '+no+' | 模棱两可 '+un+' | 未做 '+left+
      (d? ' | 不会率 '+((no+un)/d*100).toFixed(0)+'%':''));
  }
  L.push('');
  L.push('=== 要重点攻的题（不会 + 模棱两可 + 跳过）===');
  for(const q of QUESTIONS){
    const a=state.answers[q.i];
    if(!isMissRecord(a)) continue;
    const typeTxt = a.v==='unsure' ? '模棱两可' : (a.v==='skip' ? '跳过' : '不会');
    L.push('#'+q.i+' ['+typeTxt+'] '+topicShort(q.t)+(q.p==='multi'?'（多选）':''));
    L.push('  '+q.s);
    const ddisp = displayOf(q);
    ddisp.opts.forEach((o,i)=>L.push('  '+String.fromCharCode(65+i)+'. '+o));
    L.push('  正确答案：'+ddisp.ans.join('、'));
    L.push('');
  }
  const blob = new Blob([L.join('\n')], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const el = document.createElement('a');
  el.href = url; el.download = '题库练习总结.txt';
  document.body.appendChild(el); el.click();
  document.body.removeChild(el);
  URL.revokeObjectURL(url);
}

/* ---------- wiring ---------- */
document.getElementById('btnSubmit').onclick = function(){
  if(fillMode){ submitFill(); } else { submitAnswer(); }
};
document.getElementById('btnUnsure').onclick = function(){ cancelAutoAdvance(); markUnsure(); };
document.getElementById('btnNext').onclick = function(){ cancelAutoAdvance(); nextQuestion(); };
document.getElementById('btnPrev').onclick = function(){ cancelAutoAdvance(); prevQuestion(); };
document.getElementById('btnSkip').onclick = function(){
  const list = pool(); const q = list[state.cursor[state.tab]||0];
  if(!q) return;

  // 跳过 = 暂时不答，题继续留在「不会的」列表里，以后还能练
  state.answers[q.i] = { v: 'skip', sel: [] };
  save();

  // 跳过的题不会移出列表，所以正常前进即可
  cancelAutoAdvance();
  nextQuestion();
  showToast('已跳过。这题还留在「不会的」里，以后再练', 'ok', 2600);
};

// 自动跳题开关：记住选择，默认开启
(function(){
  const cb = document.getElementById('autoNext');
  if(!cb) return;
  let v = true;
  try{
    const s = localStorage.getItem('shegong_autonext');
    if(s !== null) v = (s === '1');
  }catch(e){}
  cb.checked = v;
  cb.onchange = function(){
    try{ localStorage.setItem('shegong_autonext', cb.checked ? '1' : '0'); }catch(e){}
    if(!cb.checked) cancelAutoAdvance();
  };
})();

// 选项打乱开关 + 重新打乱
(function(){
  const cb = document.getElementById('shuffleOpts');
  const btn = document.getElementById('btnReshuffle');
  if(cb){

function renderCard(){
  const card = document.getElementById('flashCard');
  const front = document.getElementById('flashFront');
  const back = document.getElementById('flashBack');
  const emptyEl = document.getElementById('reviewEmpty');
  const cntEl = document.getElementById('reviewCount');

  if(!reviewDeck.length){
    if(card) card.style.display = 'none';
    if(emptyEl) emptyEl.style.display = 'block';
    if(cntEl) cntEl.textContent = '0 / 0';
    return;
  }
  if(card) card.style.display = '';
  if(emptyEl) emptyEl.style.display = 'none';

  if(reviewIdx >= reviewDeck.length) reviewIdx = reviewDeck.length - 1;
  if(reviewIdx < 0) reviewIdx = 0;

  const qid = reviewDeck[reviewIdx];
  const q = QUESTIONS.find(x => x.i === qid);
  if(!q) { reviewIdx = 0; return; }

  if(cntEl) cntEl.textContent = (reviewIdx + 1) + ' / ' + reviewDeck.length;

  if(badge){

  const bStem = document.getElementById('flashBackStem');

  if(front) front.style.display = 'block';
  if(back) back.style.display = 'none';

  // 答案区：只显示正确答案，不列选项
  const ansEl = document.getElementById('flashAnswer');
  if(ansEl){
    // 直接按题目原始答案字母顺序取（不受选项打乱影响）
    const answers = q.a.split('').sort().map(L => q.o[L.charCodeAt(0) - 65]);

      (answers.length > 1 ? '（共 ' + answers.length + ' 个）' : '') + '</div>' +
      '<div class="fa-main">' + answers.map(a => escapeHtml(a)).join('　|　') + '</div>';

  reviewIdx++;

function cardPrev(){
  if(!reviewDeck.length) return;
  if(reviewIdx <= 0){
    showToast('已经是第一张了', 'ok', 1600);
    return;
  }
  reviewIdx--;
  renderCard();

}
function shuffleDeck(){
  if(reviewDeck.length <= 1) return;
  for(let i = reviewDeck.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = reviewDeck[i]; reviewDeck[i] = reviewDeck[j]; reviewDeck[j] = t;
  }
  reviewIdx = 0;
  renderCard();
  showToast('已打乱顺序', 'ok', 1400);
}

      else { const k=curSel.indexOf(letter); if(k>=0) curSel.splice(k,1); else curSel.push(letter); curSel.sort(); }
      refreshOptClasses(q); updateSubmitState(q);
      return;
    }
    if(e.key==='u' || e.key==='U'){ e.preventDefault(); markUnsure(); return; }
  }
  if(e.key==='ArrowRight' && locked){ nextQuestion(); }
  if(e.key==='ArrowLeft'){ prevQuestion(); }
});

// 内容转 base64（支持中文）
function ghB64Encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function ghB64Decode(b64){
  const bin = atob(String(b64).replace(/\s/g,''));
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function ghApiUrl(){
  // 按当前模式分文件：选择题 progress.json，填空题 progress-fill.json
  const base = ghCfg.path || 'progress.json';
  const fname = fillMode
    ? base.replace(/\.json$/i, '') + '-fill.json'
    : base;
  let u = 'https://api.github.com/repos/' + encodeURIComponent(ghCfg.owner) + '/' +
          encodeURIComponent(ghCfg.repo) + '/contents/' + encodeURIComponent(fname);
  if(ghCfg.branch) u += '?ref=' + encodeURIComponent(ghCfg.branch);
  return u;
}
function ghHeaders(){
  return {
    'Authorization': 'Bearer ' + ghCfg.token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
    'Content-Type': 'application/json'
  };
}

// 读取远端文件：返回 {data, sha} 或 null（文件不存在）
async function ghReadRemote(){
  const res = await fetch(ghApiUrl(), {headers: ghHeaders(), cache:'no-store'});
  if(res.status === 404) return null;
  if(res.status === 401) throw new Error('Token 无效或已过期');
  if(res.status === 403) throw new Error('没有权限（检查 Token 是否有 Contents: Read and write）');
  if(!res.ok) throw new Error('GitHub 返回 ' + res.status);
  const j = await res.json();
  if(!j || !j.content) return null;
  let data = null;
  try{ data = JSON.parse(ghB64Decode(j.content)); }catch(e){ data = null; }
  return { data, sha: j.sha };
}

// 写入远端
async function ghWriteRemote(payload, sha){
  const body = {
    message: '进度更新 ' + new Date().toLocaleString('zh-CN'),
    content: ghB64Encode(JSON.stringify(payload, null, 1))
  };
  if(sha) body.sha = sha;
  if(ghCfg.branch) body.branch = ghCfg.branch;
  const res = await fetch(ghApiUrl().split('?')[0], {
    method: 'PUT',
    headers: ghHeaders(),
    body: JSON.stringify(body)
  });
  if(res.status === 401) throw new Error('Token 无效或已过期');
  if(res.status === 403) throw new Error('没有权限写这个仓库');
  if(res.status === 409) throw new Error('文件冲突，请再点一次同步');
  if(!res.ok){
    const t = await res.text();
    throw new Error('写入失败 ' + res.status + '：' + t.slice(0,100));
  }
  return true;
}

// 合并：本地优先，远端补充
// 关键规则：同一道题两边都有记录时，以本地为准（本地是你刚答的，比云端新）
function ghMerge(local, remote){
  const out = Object.assign({}, remote);
  for(const k in local){ if(local[k]) out[k] = local[k]; }
  return out;
}

// 同步一次：读远端 -> 合并 -> 写回
async function ghSync(silent){
  if(!ghConfigured()) return false;
  if(ghBusy) return false;
  ghBusy = true;
  renderGhBtn();
  try{
    const remote = await ghReadRemote();
    const remoteAnswers = (remote && remote.data && remote.data.answers) ? remote.data.answers : {};
    const localCount = answeredCount();
    const remoteCount = Object.keys(remoteAnswers).length;

    // 合并：同一道题本地优先（本地是你刚操作过的，比云端新）
    // 云端独有的题补进来，但绝不把本地已有的记录替换成云端的旧值
    const merged = Object.assign({}, remoteAnswers);
    let localChanged = false;
    for(const k in state.answers){
      if(state.answers[k]){
        const cur = state.answers[k];
        const rem = remoteAnswers[k];
        // 本地有记录就用本地；如果内容和云端不同，说明本地更新
        if(!rem || rem.v !== cur.v || JSON.stringify(rem.sel) !== JSON.stringify(cur.sel)){
          merged[k] = cur;
          localChanged = true;
        }
      }
    }

    // 只有当云端带来了本地完全没有的题时，才把合并结果写回内存
    const addedFromRemote = Object.keys(remoteAnswers).filter(k => !state.answers[k]).length;
    if(addedFromRemote > 0){
      state.answers = merged;
      renderAll();
    }

    // 本地有变化（比云端新）才需要写回云端
    const needWrite = !remote || localChanged || addedFromRemote > 0;

    if(needWrite){
      const payload = {
        app: 'shegong_qb',
        version: 1,
        savedAt: new Date().toISOString(),
        answers: merged,
        cursor: state.cursor
      };
      await ghWriteRemote(payload, remote ? remote.sha : null);
    }

    ghOK = true;
    const n = answeredCount();
    if(!silent) showToast('GitHub 同步完成，共 ' + n + ' 条记录', 'ok');
    return true;
  }catch(e){
    ghOK = false;
    if(!silent) showToast('GitHub 同步失败：' + e.message, 'bad', 6000);
    else console.warn('GitHub 同步失败：', e.message);
    return false;
  }finally{
    ghBusy = false;
    renderGhBtn();
    save();
  }
}

    '\n依次输入三项（每项一行）：\n' +
    '1. GitHub 用户名\n' +
    '2. 仓库名（建议私有仓库，如 qb-sync）\n' +
    '3. Token（Fine-grained，只给这个仓库 Contents 读写）\n\n' +
    '留空取消。';

  const owner = prompt(msg + '\n\n第 1 项：GitHub 用户名', ghCfg.owner || '');
  if(owner === null) return;
  const repo = prompt('第 2 项：仓库名\n（用于存 progress.json，建议私有仓库）', ghCfg.repo || '');
  if(repo === null) return;
  const token = prompt('第 3 项：Token\n（Fine-grained，只授权这个仓库的 Contents: Read and write）\n输入后只会保存在本机浏览器里', '');
  if(token === null) return;

  if(!owner.trim() || !repo.trim() || !token.trim()){
    showToast('三项都要填，已取消', 'bad');
    return;
  }
  ghCfg.owner = owner.trim();
  ghCfg.repo = repo.trim();
  ghCfg.token = token.trim();
  ghCfg.path = 'progress.json';
  ghSaveCfg();
  showToast('已保存配置，正在测试连接…', 'ok');
  ghSync(false);
}

document.getElementById('btnGhSync').onclick = function(){
  if(!ghConfigured()){
    ghOpenSettings();
    return;
  }
  // 已配置：点击立即同步；长按/Shift 点击可改配置
  if(window.event && (window.event.shiftKey || window.event.altKey)){
    ghOpenSettings();
    return;
  }
  ghSync(false);
};

// 初始化
ghLoadCfg();
</script>
</body>
</html>
